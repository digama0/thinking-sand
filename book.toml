[book]
title = "hwverif — How to verify a computer down to physics"
authors = ["Mario Carneiro"]
language = "en"
# Sources are STAGED into book-src/ by tools/build-book.sh (git-tracked *.md + tools/),
# because src = "." would make mdBook copy the ~490 MB data/ tree into the output.
src = "book-src"

[build]
build-dir = "book"

[output.html]
# Project-site path on GitHub Pages; only used for the 404 page's absolute links.
# Adjust if the repository is published under a different name.
site-url = "/hwverif/"
default-theme = "light"
preferred-dark-theme = "navy"
