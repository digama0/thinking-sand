name: book

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        # Pinned release binary; bump deliberately (a bad tag 404s here, loudly).
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install tcl (the SDC checkers elaborate Tcl)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tcl
      - name: Cache design artifacts
        # Keyed on the fetch script: its pinned SHAs are the data's identity.
        uses: actions/cache@v4
        with:
          path: data
          key: data-checks-${{ hashFiles('tools/fetch-data.sh') }}
      - name: Fetch pinned design artifacts (what the checkers consume)
        run: tools/fetch-data.sh checks
      - name: Build (runs the layer scoreboards; verdicts land in the Scoreboard appendix)
        run: tools/build-book.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
